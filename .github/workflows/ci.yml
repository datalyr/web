name: CI

# Public repo: GitHub-hosted runners are free here, and fork PRs never run on
# paid (Blacksmith) machines. Fork PRs get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR cancels the older run; each push to main keeps
# its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build
      # The deployable dl.js bundles live in datalyr/datalyr; here the check
      # covers this package's freshly built dist/.
      - name: Bundle guard (bootstrap, version, no rrweb in the core bundle)
        run: npm run build:check:dist
